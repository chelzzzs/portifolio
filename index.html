<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michel Zulszeski · Desenvolvedor Full Stack</title>
    <meta name="description" content="Portfólio de Michel Zulszeski, desenvolvedor full stack. Cada planeta deste sistema é um projeto." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23000' stroke='%23ffb36b' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Abertura em CSS puro, embutida aqui: aparece no primeiro paint, antes de o JS
      (React + three.js) terminar de baixar. A App só troca a classe para dissolver
      o overlay e depois o remove.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }

      .intro {
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #000;
        color: #eceef3;
        font-family: "Space Grotesk", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 1.1s var(--ease);
      }

      .intro.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .intro__inner {
        text-align: center;
        padding: 0 16px;
        transition: transform 1.4s var(--ease), filter 1.1s var(--ease);
      }

      .intro.is-leaving .intro__inner {
        transform: scale(1.08);
        filter: blur(8px);
      }

      .intro__name {
        font-size: clamp(30px, 6vw, 64px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .intro__name span {
        display: inline-block;
        animation: intro-letter 0.8s var(--ease) both;
        animation-delay: calc(0.15s + var(--i) * 38ms);
      }

      .intro__line {
        display: block;
        width: min(220px, 50vw);
        height: 1px;
        margin: 22px auto 16px;
        background: linear-gradient(90deg, transparent, #ffb36b, transparent);
        animation: intro-line 1s var(--ease) 0.7s both;
      }

      .intro__role {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(236, 238, 243, 0.62);
        animation: intro-fade 0.8s var(--ease) 0.95s both;
      }

      @keyframes intro-letter {
        from {
          opacity: 0;
          transform: translateY(0.35em);
          filter: blur(10px);
        }
      }

      @keyframes intro-line {
        from {
          transform: scaleX(0);
          opacity: 0;
        }
      }

      @keyframes intro-fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .intro {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro__inner">
        <div class="intro__name"><span style="--i: 0">M</span><span style="--i: 1">i</span><span style="--i: 2">c</span><span style="--i: 3">h</span><span style="--i: 4">e</span><span style="--i: 5">l</span><span style="--i: 6">&nbsp;</span><span style="--i: 7">Z</span><span style="--i: 8">u</span><span style="--i: 9">l</span><span style="--i: 10">s</span><span style="--i: 11">z</span><span style="--i: 12">e</span><span style="--i: 13">s</span><span style="--i: 14">k</span><span style="--i: 15">i</span></div>
        <span class="intro__line"></span>
        <p class="intro__role" id="intro-role">Desenvolvedor Full Stack</p>
      </div>
    </div>
    <script>
      // Idioma decidido antes do primeiro paint, para a abertura já sair no idioma certo:
      // ?lang=en|pt > escolha salva > idioma do navegador. A App lê o resultado em <html lang>
      // (src/i18n.tsx usa a mesma chave "lang" no localStorage).
      (function () {
        var lang;
        try {
          var param = new URLSearchParams(location.search).get("lang");
          if (param === "pt" || param === "en") {
            lang = param;
            localStorage.setItem("lang", param);
          } else {
            var saved = localStorage.getItem("lang");
            if (saved === "pt" || saved === "en") lang = saved;
          }
        } catch (e) {}
        if (!lang) {
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "pt"];
          lang = String(prefs[0]).toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
        }
        if (lang === "en") {
          document.documentElement.lang = "en";
          document.title = "Michel Zulszeski · Full Stack Developer";
          document.querySelector('meta[name="description"]').setAttribute("content", "Portfolio of Michel Zulszeski, full stack developer. Every planet in this system is a project.");
          document.getElementById("intro-role").textContent = "Full Stack Developer";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
